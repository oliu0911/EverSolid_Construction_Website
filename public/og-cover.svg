<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1916"/>
      <stop offset="1" stop-color="#2A2721"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#3A3833" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- datum mark -->
  <g transform="translate(70,70)">
    <rect width="78" height="78" fill="none" stroke="#E6530F" stroke-width="4"/>
    <line x1="0" y1="0" x2="22" y2="22" stroke="#E6530F" stroke-width="2"/>
    <text x="39" y="52" text-anchor="middle" font-family="monospace, sans-serif" font-size="34" font-weight="700" fill="#F3F1EB" letter-spacing="1">ES</text>
  </g>

  <!-- dimension rule -->
  <g stroke="#E6530F" stroke-width="3">
    <line x1="72" y1="540" x2="1128" y2="540"/>
    <line x1="72" y1="520" x2="72" y2="560"/>
    <line x1="1128" y1="520" x2="1128" y2="560"/>
  </g>
  <rect x="70" y="470" width="1060" height="3" fill="#E6530F"/>

  <text x="600" y="295" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="96" font-weight="400" fill="#F3F1EB">Ever Solid</text>
  <text x="600" y="360" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="400" fill="#8A857B" letter-spacing="8">CONSTRUCTION · BELIZE</text>

  <text x="72" y="470" font-family="monospace, sans-serif" font-size="18" fill="#8A857B" letter-spacing="3">BUILDING THE SPACES WHERE LIFE HAPPENS</text>
  <text x="1128" y="470" text-anchor="end" font-family="monospace, sans-serif" font-size="18" fill="#8A857B" letter-spacing="3">SHEET 01 · EST. 20+ YRS</text>
</svg>