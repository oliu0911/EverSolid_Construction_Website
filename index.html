      content="EverSolid Construction, a Belize construction company building custom homes, restaurants, hardware and hotels. Over 20 years of building in Belize."

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EverSolid Construction" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EverSolid Construction — Building the Spaces Where Life Happens." />

      name="twitter:description"
      content="Belize construction, built on twenty years of proven work. Custom homes, restaurants, hardware and hotels across Belize."
    />

    <meta name="theme-color" content="#1A1916" />

    <!-- LocalBusiness / GeneralContractor structured data (local SEO). No street
         address until EverSolid's registered Belize address is confirmed —
         never fabricate the NAP streetAddress. Add it here once known. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GeneralContractor",
        "name": "EverSolid Construction",
        "url": "https://eversolidbz.com/",
        "telephone": "+501-624-4333",
        "email": "info@eversolidbz.com",
        "image": "https://eversolidbz.com/og-cover.png",
        "priceRange": "$$",
        "slogan": "Building the Spaces Where Life Happens.",
        "areaServed": { "@type": "Country", "name": "Belize" },
        "sameAs": ["https://wa.me/5016244333"]
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <!--
      DIRECTION CONTRACT — EverSolid Construction (single-page, outrage-directed)
      Seed key: 005a6c39 · Raw Worksite Honesty
      Mode: Persuade. Visitor decides and acts; design IS the product.

      Narrative spine (kept verbatim from PRODUCT.md/PRD):
        "Building the Spaces Where Life Happens." Portfolio/proven-work led, not
        service breadth. A real Belize customer must want to WhatsApp us.

      World tokens (see tailwind.config.js + index.css — do not drift):
        - Concrete warm grays  #F6F4EF → #5F5B54, graphite ink #1A1916
        - ONE accent: rebar orange #E6530F (accessibility floor #C0440A for text)
        - Ruling-engine drafting grammar: plan-grid, dimension rules, crosshair
          datums, section marks, "field note" annotation
        - Type: DM Serif Display (display serif) + Inter (body)
        - Surface: paper #F3F1EB ground, ink inked details, honest construction

      Absolute bans (craft floor):
        - No eyebrow/kicker above any heading. No section numbers unless they
          carry measurement meaning. Mono only states measured fact.
        - No decorative drop-shadow on art; no gradient as decoration; no
          render-of-the-finished-shell pretending to be a photograph.

      Fallbacks (locked):
        - Content + first hero scene visible without JS (all hiding is GSAP-only,
          never CSS). prefers-reduced-motion disables carousel + reveals.
        - Why Choose Us + What We Build copy is customer-supplied — never rewritten.

      FINISH: this is the on-rails finish; when inspected, it should read as a
      confident, restrained piece of construction company craft — not a demo.
    -->
    <div id="app"></div>
  </body>
</html>
